# Row 3: upload-artifact / download-artifact v4+ through the results service.
name: p-artifacts
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out && echo "MARK-artifact-content" > out/probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conf-probe
          path: out/probe.txt
          retention-days: 1
  down:
    needs: up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conf-probe
          path: got
      - run: echo "MARK-downloaded-$(cat got/probe.txt)"
